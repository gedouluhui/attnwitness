[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attnwitness"
version = "0.2.0"
description = "Independent attention-mask contracts with concrete visibility witnesses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "gedouluhui"}]
dependencies = ["numpy>=2.0"]

[project.scripts]
attnwitness = "attnwitness.cli:main"

[project.optional-dependencies]
torch = ["torch>=2.12"]

[tool.setuptools.packages.find]
where = ["src"]
